name: Android Release

on:
  push:
    branches:
      - feature/native-kotlin
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, например v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build native Kotlin APK (armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/feature/native-kotlin" && -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "No signing secrets on feature branch; building unsigned validation APK."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Release
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          if [[ -f android/app/upload-keystore.jks ]]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "APK is unsigned (validation build)."
          fi
          cp "$APK" Obtainium-kotlin-armeabi-v7a-release.apk
          echo "APK_SIZE=$(du -h Obtainium-kotlin-armeabi-v7a-release.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload branch validation APK
        if: github.ref == 'refs/heads/feature/native-kotlin'
        uses: actions/upload-artifact@v4
        with:
          name: Obtainium-kotlin-armeabi-v7a-release
          path: Obtainium-kotlin-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: "Obtainium Kotlin ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          body: |
            Native Android/Kotlin release build.
            - UI: Jetpack Compose
            - APK: armeabi-v7a
            - APK size: ${{ env.APK_SIZE }}
            - Commit: ${{ github.sha }}
          files: Obtainium-kotlin-armeabi-v7a-release.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
